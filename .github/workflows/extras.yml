name: Rożne i kartki (na żądanie)

on:
  workflow_dispatch:
    inputs:
      day:
        description: "Dzień RRRR-MM-DD (puste = dziś)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  extras:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/extras.cjs
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DAY: ${{ inputs.day }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/extras.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rynki dodatkowe $(date -u +%F)"
          git pull --rebase origin main
          git push
