name: Kursy i kupon dnia

on:
  schedule:
    - cron: "7 4 * * *"    # 06:07 czasu polskiego latem (05:07 zimą); nieokrągła minuta = mniejsze opóźnienia GitHuba
  workflow_dispatch:        # ręczne uruchomienie: Actions → Kursy i kupon dnia → Run workflow

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pobierz kursy i ułóż kupon dnia
        run: node scripts/daily.cjs
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Zapisz dane w repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/odds.json data/daily.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Kursy $(date -u +%F)"
          git pull --rebase origin main
          git push
